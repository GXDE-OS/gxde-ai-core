syntax = "proto3";
package gxde.ai.agent;

import "google/protobuf/empty.proto";

enum ApiFormat {
  API_FORMAT_UNSPECIFIED = 0;
  API_FORMAT_OPENAI = 1;
  API_FORMAT_ANTHROPIC = 2;
  API_FORMAT_GEMINI = 3;
}

message OpenAiOptions {
  optional string organization = 1;
}

message AnthropicOptions {
  string api_version = 1;
  int32 default_max_tokens = 2;
}

message GeminiOptions {
  string api_version = 1;
}

message AccountConfig {
  string id = 1;
  ApiFormat format = 2;
  string base_url = 3;
  string secret_ref = 4;
  string default_model = 5;
  oneof options {
    OpenAiOptions openai = 6;
    AnthropicOptions anthropic = 7;
    GeminiOptions gemini = 8;
  }
}

message Message {
  string role = 1;
  string content = 2;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
}

message LlmRequest {
  string model = 1;
  string system = 2;
  repeated Message messages = 3;
  repeated ToolDefinition tools = 4;
  optional int32 max_tokens = 5;
}

message ContentBlock {
  string type = 1;
  string text = 2;
  string tool_use_id = 3;
  string tool_use_name = 4;
  string tool_use_input_json = 5;
}

message StopReason {
  string reason = 1;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message LlmResponse {
  repeated ContentBlock content = 1;
  StopReason stop_reason = 2;
  Usage usage = 3;
}

message ToolCallDelta {
    string id = 1;
    string name = 2;
    string arguments_json = 3;
}

message LlmDelta {
  int32 index = 1;
  oneof delta {
    string text = 2;
    ToolCallDelta tool_call = 3;
  }
}

message GenerateRequest {
  string account_id = 1;
  LlmRequest request = 2;
}

message GenerateEvent {
  oneof event {
    LlmDelta delta = 1;
    LlmResponse response = 2;
  }
}

message CreateAccountRequest {
    AccountConfig config = 1;
}

message GetAccountRequest {
    string id = 1;
}

message ListAccountsRequest {}

message ListAccountsResponse {
    repeated AccountConfig accounts = 1;
}

message DeleteAccountRequest {
    string id = 1;
}

service AccountService {
  rpc CreateAccount(CreateAccountRequest) returns (AccountConfig);
  rpc GetAccount(GetAccountRequest) returns (AccountConfig);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty);
}

service AgentService {
  rpc Generate(GenerateRequest) returns (stream GenerateEvent);
}
